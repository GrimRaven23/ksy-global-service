name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
          SESSION_SECRET: "ci-test-secret-that-is-at-least-32-characters-long"
          NEXTAUTH_SECRET: "ci-test-secret-that-is-at-least-32-characters-long"

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ksy_test"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/ksy_test"
      SESSION_SECRET: "ci-test-secret-that-is-at-least-32-characters-long"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ksy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npx prisma db push
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ksy_test"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/ksy_test"
      - run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ksy_test"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/ksy_test"
          SESSION_SECRET: "ci-test-secret-that-is-at-least-32-characters-long"
      - name: Seed test data
        run: npx tsx scripts/seed-ci.ts
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ksy_test"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/ksy_test"
          TEST_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'admin@ksy-global.com' }}
          TEST_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'Admin@12345' }}
      - name: Start Next.js server
        run: |
          npx next start -p 3000 &
          READY=0
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000/api/health | grep -q "healthy"; then
              echo "Server is ready"
              READY=1
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "Server failed to become ready"
            exit 1
          fi
      - run: npm run test:e2e
        env:
          BASE_URL: "http://localhost:3000"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ksy_test"
          TEST_EMAIL: ${{ secrets.TEST_USER_EMAIL || 'admin@ksy-global.com' }}
          TEST_PASSWORD: ${{ secrets.TEST_USER_PASSWORD || 'Admin@12345' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
