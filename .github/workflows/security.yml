name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 4"

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: github/codeql-action/init@4dd16135b69a43b6c8efb853346f8437d92d3c93
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/autobuild@4dd16135b69a43b6c8efb853346f8437d92d3c93

      - uses: github/codeql-action/analyze@4dd16135b69a43b6c8efb853346f8437d92d3c93
        with:
          category: "/language:javascript-typescript"

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Security audit
        run: npm audit --audit-level=critical
        continue-on-error: false

      - name: Check for known vulnerabilities
        run: npx audit-ci --high
        continue-on-error: true

  secrets-check:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check for hardcoded secrets
        run: |
          echo "Scanning for potential hardcoded secrets..."
          FOUND=0
          
          # Check for hardcoded passwords (not in types, validation, or auth logic)
          if grep -rn 'password\s*=\s*"[^"]\{8,\}"' src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "passwordHash" | grep -v "password:" | grep -v "verifyPassword" | grep -v "hashPassword" | grep -v "z\." | grep -v "\.test\." | grep -v "test-" | grep -v "min(" | grep -v "max(" | grep -v "schema" | grep -v "placeholder" | grep -v "example"; then
            echo "WARNING: Potential hardcoded passwords found"
            FOUND=1
          fi
          
          # Check for API keys / tokens in source (not in types or validation)
          if grep -rn 'api[_-]\?key\s*=\s*"[^"]\{20,\}"' src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "schema" | grep -v "validation"; then
            echo "WARNING: Potential hardcoded API keys found"
            FOUND=1
          fi
          
          # Check for secret keys in source (not in types, validation, or env config)
          if grep -rn 'secret\s*=\s*"[^"]\{20,\}"' src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "SESSION_SECRET" | grep -v "CSRF_SECRET" | grep -v "schema" | grep -v "validation" | grep -v "env.ts" | grep -v "process.env"; then
            echo "WARNING: Potential hardcoded secrets found"
            FOUND=1
          fi
          
          if [ "$FOUND" -eq 1 ]; then
            echo "Review the findings above. If these are false positives, update the scan patterns."
            exit 1
          fi
          
          echo "No hardcoded secrets detected"
